version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: TTproject
      MYSQL_USER: root
      MYSQL_PASSWORD: Root@1234
      MYSQL_ROOT_PASSWORD: Root@1234
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:mysql://db:3306/TTproject
      JDBC_USER: root
      JDBC_PASS: Root@1234
